name: Main branch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run typecheck && npm run lint && npm run test && npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: backend-starter-kit:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: backend-starter-kit:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      # Add registry login, push, migration deployment, and post-deploy health check
      # after selecting a target platform and storing its secrets in GitHub Actions.
